# App stack for parallel agents: see scripts/stack.py and CLAUDE.md ("Parallel agents").
# ${VAR:-default} reads the environment first, then the main checkout's .env.

[pools.db]  # dev DBs: app_template, app_s<N> (cloned from the template)
url = "postgresql+psycopg://app:app@127.0.0.1:${DB_PORT:-5432}"

[pools.db_test]  # test DBs: app_test_s<N> (empty; pytest builds the schema)
url = "postgresql+psycopg://app:app@127.0.0.1:${DB_PORT:-5432}"

[pools.redis]  # slot N uses Redis DB index N
url = "redis://127.0.0.1:${REDIS_PORT:-6379}"

[template]
name = "app_template"

[ports]
api_base = 8100  # API_PORT = api_base + N
web_base = 5200  # WEB_PORT = web_base + N

[limits]
slots = 6    # slots 1..6
heavy = 2    # concurrent `stack run --heavy` jobs
grace_s = 600  # a slot used within this many seconds is never reclaimed as dead
